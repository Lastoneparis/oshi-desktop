# NOTE: org.gradle.java.home is deliberately NOT set here.
# It used to pin /opt/homebrew/opt/openjdk@17/... , which is a path that exists on exactly
# one machine — the build failed on Windows and Linux before Gradle even started. The JDK
# now comes from JAVA_HOME: ./oshi.sh finds one on this Mac, oshi.cmd does the same on
# Windows, and every normal Linux/Windows box already has JAVA_HOME set.
# To pin one anyway, put org.gradle.java.home in ~/.gradle/gradle.properties (per machine),
# not here (per repository).
org.gradle.jvmargs=-Xmx1g
org.gradle.parallel=false
kotlin.stdlib.default.dependency=true

# The Android tree (whose v2 crypto sources are compiled INTO this project) and the iOS
# tree (read by the wire-parity tests) both default to siblings of this directory:
#   <parent>/OSHI-Android  and  <parent>/OSHI
# Both are READ-ONLY to this build; nothing in either tree is ever written.
# Override per invocation if your layout differs:
#   ./gradlew test -PoshiAndroidRoot=/path/to/OSHI-Android -PoshiIosRoot=/path/to/OSHI
