# Proves this repository builds and tests FROM ONE CLONE, on the platforms it ships for.
#
# That is the whole point of the `shared/` directory: the seven files the desktop compiles
# out of the Android tree are vendored here, so a reader can verify the client rather than
# only read it. A green run on this workflow is the claim "the published source is the
# source of the published installers" being checked rather than asserted.
name: build

on:
  push: { branches: ['**'] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      # THE SEVEN COMPILED FILES AND THE TWO REFERENCES ARE DIFFERENT THINGS, and this
      # step failed on its first run for getting that wrong. `V2KeysClient.kt` and
      # `LocalLLMManager.kt` are Android classes read by parity tests and never compiled;
      # they import `android.*` correctly, and scanning all of `shared/` flagged them.
      - name: The vendored set is exactly what it should be
        shell: bash
        run: |
          set -euo pipefail
          v=shared/OSHI-Android/app/src/main/java/com/oshi/messenger
          COMPILED="network/v2/OSHICryptoV2.kt network/v2/OSHICryptoV2Streaming.kt
                    network/v2/OSHIRatchetV2.kt network/v2/V2Session.kt
                    network/v2/V2FileKeyMessage.kt network/v2/V2RetryBudget.kt
                    service/LlamaCpp.kt"
          REFERENCED="network/v2/V2KeysClient.kt service/LocalLLMManager.kt"
          for f in $COMPILED $REFERENCED; do
            [ -f "$v/$f" ] || { echo "::error::missing vendored source: $f"; exit 1; }
          done
          echo "all nine present"

          # The TRIPWIRE, enforced rather than documented: the shared crypto core is
          # portable only as long as nothing in it reaches for the Android SDK. An
          # `import android.*` in a COMPILED file means the desktop and the phone have
          # stopped compiling the same source.
          #
          # `grep -c` into a variable with `|| true`, never `grep | wc -l`: grep exits 1
          # when it matches nothing, and under `pipefail` that aborts the step — so the
          # CLEAN case would fail and a dirty one would pass. That is how this step broke.
          bad=0
          for f in $COMPILED; do
            n="$(grep -c '^import android' "$v/$f" || true)"
            if [ "$n" != "0" ]; then echo "::error::$f imports the Android SDK ($n)"; bad=1; fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "the seven compiled files import no Android SDK"

          # A scan that can pass by not running is not a scan. The two REFERENCE files do
          # import android.*, which makes them a free positive control: if the pattern
          # finds nothing in them, the pattern is broken, not the tree.
          for f in $REFERENCED; do
            n="$(grep -c '^import android' "$v/$f" || true)"
            [ "$n" != "0" ] || { echo "::error::control failed — the scan found no android import in $f"; exit 1; }
          done
          echo "positive control: the two reference files do import it, as expected"

      - name: Test
        shell: bash
        run: ./gradlew test --no-daemon

      # A SKIPPED TEST LOOKS LIKE A PASSING ONE. 22 wire-parity tests read the iOS and
      # Android trees, which are not in this repository, and guard themselves into
      # skipping. Printing the count means a reader of this log knows what did NOT run.
      - name: Say how many tests actually ran
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = s = 0
          names = []
          for x in glob.glob("build/test-results/test/*.xml"):
              r = ET.parse(x).getroot()
              t += int(r.get("tests", 0)); s += int(r.get("skipped", 0))
              f += int(r.get("failures", 0)) + int(r.get("errors", 0))
              for c in r.iter("testcase"):
                  if c.find("skipped") is not None:
                      names.append("%s.%s" % (c.get("classname", "?").split(".")[-1], c.get("name")))
          print("tests %d  ran %d  skipped %d  failed %d" % (t, t - s, s, f))
          # NAME them rather than explain them. An earlier version of this step said the
          # skips "need the private iOS/Android trees", and that was only partly true: the
          # count differs per platform (26 Ubuntu, 25 Windows, 22 macOS) because some tests
          # are OS-conditional too. A guessed cause in a log is worse than a list.
          for n in sorted(names):
              print("  skipped: %s" % n)
          PY

  deb:
    name: build the .deb and install it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Tools jpackage drives
        run: sudo apt-get update -qq && sudo apt-get install -y fakeroot binutils

      - name: Build
        run: ./gradlew packageDeb -PappVersion=1.0.0 --no-daemon

      # THE REGRESSION THIS JOB EXISTS FOR. jpackage's default postinst runs
      # `xdg-desktop-menu install` under `set -e`, so on a machine with no writable menu
      # directory — a CI runner, a headless server, a container, WSL without a desktop —
      # menu registration FAILS THE INSTALL, and its default prerm then fails the removal
      # too, leaving a package that can be neither configured nor removed. Measured against
      # the published package on 2026-09-13. `platform/linux/packaging/{postinst,prerm}`
      # override both; this runner has no writable menu directory, so it is a genuine
      # reproduction rather than a test of the happy path.
      - name: Install it on a host with no desktop environment
        run: |
          set -euo pipefail
          deb="$(ls build/jpackage/out/*.deb | head -1)"
          echo "installing $(basename "$deb")"
          sudo apt-get install -y "./$deb" 2>&1 | tail -20
          # `dpkg -s` reports the CONFIGURED state; "install ok installed" is the only
          # value that means the postinst ran to completion.
          status="$(dpkg -s oshi-desktop | sed -n 's/^Status: //p')"
          echo "package status : $status"
          [ "$status" = "install ok installed" ] || {
            echo "::error::package is not fully configured — the postinst failed"; exit 1; }

      - name: Run what the package manager put on disk
        run: |
          set -euo pipefail
          bin="$(dpkg -L oshi-desktop | grep -E '/bin/[A-Za-z-]*OSHI[A-Za-z-]*$' | head -1)"
          echo "launcher : $bin"
          out="$("$bin" --probe 2>&1 || true)"
          echo "$out" | head -20
          echo "$out" | grep -q 'known-answer vectors' || {
            echo "::error::the installed binary did not reproduce iOS's crypto vectors"; exit 1; }

      - name: Remove it — which the old prerm could not do either
        run: |
          set -euo pipefail
          sudo apt-get remove -y oshi-desktop
          ! dpkg -s oshi-desktop 2>/dev/null | grep -q '^Status: install ok installed'
          echo "built, installed, ran and removed on a host with no desktop environment."
