name: Release installers

# Tag-triggered: builds the native installer on each OS (jpackage does NOT cross-build) and
# attaches them to the GitHub Release for that tag. Push a tag like `v1.0.0` to trigger.
# The existing build.yml keeps handling push/PR build+test.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write      # create/update the Release and upload assets
  attestations: write  # publish GitHub build provenance for every installer
  id-token: write      # OIDC token required by the attestation service

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          # No macOS job: the Mac app ships through the Mac App Store, and the
          # website points Mac users there. Do not publish a .dmg here.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17 (Temurin — includes jpackage)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # Windows .msi needs WiX Toolset v3 on PATH (jpackage 17 does not understand WiX v4+).
      - name: Install WiX Toolset v3 (Windows)
        if: matrix.name == 'windows'
        run: choco install wixtoolset -y --no-progress
        shell: pwsh

      - name: Make gradlew executable (Unix)
        if: matrix.name != 'windows'
        run: chmod +x ./gradlew

      - name: Derive app version from the tag (v1.2.3 -> 1.2.3)
        id: ver
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must be vMAJOR.MINOR.PATCH, got: $REF" >&2; exit 1 ;;
          esac
          echo "appVersion=${REF#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build native installer(s)
        # macOS jpackage requires the app-version's first number >= 1, and the build refuses
        # to relabel silently, so pass the tag version explicitly.
        run: ./gradlew packageNative -PappVersion=${{ steps.ver.outputs.appVersion }} --no-daemon --stacktrace
        shell: bash

      - name: Collect installers (versioned + stable-named)
        # Upload BOTH the versioned file (OSHI-1.2.3.msi) AND a stable-named copy
        # (OSHI-Desktop.msi) so the site can link releases/latest/download/OSHI-Desktop.msi
        # and never need editing when the version bumps.
        run: |
          mkdir -p dist
          copy_stable() { # <glob> <stable-name>
            f=$(find build/jpackage/out -maxdepth 1 -type f -name "$1" | head -1)
            if [ -n "$f" ]; then cp "$f" "dist/$(basename "$f")"; cp "$f" "dist/$2"; fi
          }
          copy_stable '*.msi'     OSHI-Desktop.msi
          copy_stable '*.exe'     OSHI-Desktop-Setup.exe
          copy_stable '*.deb'     oshi-desktop-amd64.deb
          copy_stable '*.rpm'     oshi-desktop.x86_64.rpm
          copy_stable '*.AppImage' OSHI-Desktop.AppImage
          copy_stable '*.tar.gz'  oshi-desktop-linux-x86_64.tar.gz
          python - <<'PY'
          import os
          from hashlib import sha256
          from pathlib import Path
          files = sorted(path for path in Path("dist").iterdir() if path.is_file())
          lines = [f"{sha256(path.read_bytes()).hexdigest()}  {path.name}" for path in files]
          Path(f"dist/SHA256SUMS-{os.environ['MATRIX_NAME']}.txt").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
          ls -la dist
        shell: bash
        env:
          MATRIX_NAME: ${{ matrix.name }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oshi-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: warn

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Attach installers to the Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: false
