name: Release installers

# Tag-triggered: builds the native installer on each OS (jpackage does NOT cross-build) and
# attaches them to the GitHub Release for that tag. Push a tag like `v1.0.0` to trigger.
# The existing build.yml keeps handling push/PR build+test.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # create/update the Release and upload assets

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin — includes jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Windows .msi needs WiX Toolset v3 on PATH (jpackage 17 does not understand WiX v4+).
      - name: Install WiX Toolset v3 (Windows)
        if: matrix.name == 'windows'
        run: choco install wixtoolset -y --no-progress
        shell: pwsh

      - name: Make gradlew executable (Unix)
        if: matrix.name != 'windows'
        run: chmod +x ./gradlew

      - name: Derive app version from the tag (v1.2.3 -> 1.2.3)
        id: ver
        run: |
          REF="${GITHUB_REF_NAME:-v1.0.0}"
          echo "appVersion=${REF#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build native installer(s)
        # macOS jpackage requires the app-version's first number >= 1, and the build refuses
        # to relabel silently, so pass the tag version explicitly.
        run: ./gradlew packageNative -PappVersion=${{ steps.ver.outputs.appVersion }} --no-daemon --stacktrace
        shell: bash

      - name: Collect installers (versioned + stable-named)
        # Upload BOTH the versioned file (OSHI-1.2.3.msi) AND a stable-named copy
        # (OSHI-Desktop.msi) so the site can link releases/latest/download/OSHI-Desktop.msi
        # and never need editing when the version bumps.
        run: |
          mkdir -p dist
          copy_stable() { # <glob> <stable-name>
            f=$(find build/jpackage/out -maxdepth 1 -type f -name "$1" | head -1)
            if [ -n "$f" ]; then cp "$f" "dist/$(basename "$f")"; cp "$f" "dist/$2"; fi
          }
          copy_stable '*.msi'     OSHI-Desktop.msi
          copy_stable '*.exe'     OSHI-Desktop-Setup.exe
          copy_stable '*.deb'     oshi-desktop-amd64.deb
          copy_stable '*.rpm'     oshi-desktop.x86_64.rpm
          copy_stable '*.dmg'     OSHI-Desktop.dmg
          copy_stable '*.AppImage' OSHI-Desktop.AppImage
          copy_stable '*.tar.gz'  oshi-desktop-linux-x86_64.tar.gz
          ls -la dist
        shell: bash

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oshi-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: warn

      - name: Attach installers to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
